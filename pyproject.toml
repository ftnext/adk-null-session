[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-null-session"
description = "Invocation-local, non-persisting session service for Google ADK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nikkie", email = "takuyafjp+develop@gmail.com" }]
keywords = ["google-adk", "session", "stateless"]
dependencies = ["google-adk>=1.27.0,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
test-a2a = ["a2a-sdk[http-server]>=0.3.25,<1"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-randomly>=3.16,<5",
    "a2a-sdk[http-server]>=0.3.25,<1",
    "ruff>=0.14,<1",
    "build>=1.2,<2",
    "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/ftnext/adk-null-session"

[tool.setuptools.dynamic]
version = { attr = "adk_null_session.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["adk_null_session*"]

[tool.setuptools.package-data]
adk_null_session = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
